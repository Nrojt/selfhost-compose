services:
  jellyfin-edge:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:8096
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYFIN_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jellyseerr-edge:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:5055
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYSEERR_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
