services:
  jellyfin-edge:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:8096
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYFIN_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # Jellyswarm: combines the homeserver Jellyfin and the AIOStreams
  # Jellyfin-compatible server (/jellyfin) into one Jellyfin API.
  # Backends are configured in its UI at /ui:
  #   - Jellyfin:    http://${SERVICE_IP}:8096 (over Tailscale)
  #   - AIOStreams:  https://aiostreams.nrojt.com/jellyfin
  # Healthcheck is built into the image (/health, /ready).
  jellyswarrm:
    image: ghcr.io/llukas22/jellyswarrm:0.3.1@sha256:cb145e7391e5cf583bd7f28b0e2d866e93ad95f603e1cdf2d88085390f7f83fa
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_JELLYSWARRM_3000
      - JELLYSWARRM_USERNAME=${JELLYSWARRM_USERNAME}
      - JELLYSWARRM_PASSWORD=${JELLYSWARRM_PASSWORD}
    volumes:
      - ./jellyswarrm_data:/app/data
  jellyseerr-edge:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:5055
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYSEERR_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
