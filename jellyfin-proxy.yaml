services:
  jellyfin-edge:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:8096
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYFIN_EDGE_8080
  jellyseerr-edge:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:5055
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYSEERR_EDGE_8080
