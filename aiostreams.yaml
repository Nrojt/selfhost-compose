services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVICE_FQDN_NZBHYDRA_5076
    volumes:
      - ./data/nzbhydra2:/config
    healthcheck:
      test: ["CMD", "exit", "0"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
