services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.36.0
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_AIOSTREAMS_3000
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH}
      - AIOSTREAMS_AUTH_PERMISSIONS=${AIOSTREAMS_AUTH_PERMISSIONS}
      - AIOSTREAMS_AUTH_REQUIRED=true
      - ALLOW_PRIVATE_URLS=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:9.1.1
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVICE_FQDN_NZBHYDRA_5076
    volumes:
      - ./data/nzbhydra2:/config
    healthcheck:
      test: ["CMD", "exit", "0"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
