services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.37.0@sha256:bcfd8580695a50c8f464578a0e25af065f3bd17eac35ed82a733a18342ca9718
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_AIOSTREAMS_3000
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH}
      - AIOSTREAMS_AUTH_PERMISSIONS=${AIOSTREAMS_AUTH_PERMISSIONS}
      - AIOSTREAMS_AUTH_REQUIRED=true
      - ALLOW_PRIVATE_URLS=true
      # relay instead of 302 to TMDB: Jellyswarrm <0.3.2 replays the upstream Host header on image redirects and gets 403. shortcut: remove once Jellyswarrm ships LLukas22/Jellyswarrm#213 (main has it, no release yet).
      - JELLYFIN_IMAGE_DELIVERY=relay
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:9.2.0@sha256:aea72229164f1ebf18aa66abb3b3b688e7ea011598b785ed600732978cd18fe6
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVICE_FQDN_NZBHYDRA2_5076
    volumes:
      - ./data/nzbhydra2:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5076/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
