services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.36.0@sha256:83893d1c37eaaaf9ad1e9286bd857220a6b8f042a4f1eac3fa7356017aa2b184
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_AIOSTREAMS_3000
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH}
      - AIOSTREAMS_AUTH_PERMISSIONS=${AIOSTREAMS_AUTH_PERMISSIONS}
      - AIOSTREAMS_AUTH_REQUIRED=true
      - ALLOW_PRIVATE_URLS=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:9.1.1@sha256:52bbcf7fafb7dc4316936cd4694388b26ed7ddd4e3363bc961f7527e48c3594e
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVICE_FQDN_NZBHYDRA2_5076
    volumes:
      - ./data/nzbhydra2:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5076/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
