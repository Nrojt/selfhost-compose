services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.38.1@sha256:1b90bc2fda70f365dff2ce98fc311a24708cca9841efe09aefe309cd4da1fb2c
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_AIOSTREAMS_3000
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH}
      - AIOSTREAMS_AUTH_PERMISSIONS=${AIOSTREAMS_AUTH_PERMISSIONS}
      - AIOSTREAMS_AUTH_REQUIRED=true
      - ALLOW_PRIVATE_URLS=true
      # relay instead of 302 to TMDB: Jellyswarrm <0.3.2 replays the upstream Host header on image redirects and gets 403. shortcut: remove once Jellyswarrm ships LLukas22/Jellyswarrm#213 (main has it, no release yet).
      - JELLYFIN_IMAGE_DELIVERY=relay
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:9.3.4@sha256:7d272e5d458dc0d20399a28bf41efcecdfef334c5220067546ea80cf6692966a
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVICE_FQDN_NZBHYDRA2_5076
    volumes:
      - ./data/nzbhydra2:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5076/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
