# Jellyswarm: combines the actual Jellyfin server and the AIOStreams
# Jellyfin-compatible server (/jellyfin) into one Jellyfin API.
# Healthcheck is built into the image (/health, /ready).
services:
  jellyswarrm:
    # main, not a release: the image-redirect fix (LLukas22/Jellyswarrm#213) is unreleased. Renovate won't offer version
    # bumps while the tag is main, so switch back to a release tag once 0.3.2 exists.
    image: ghcr.io/llukas22/jellyswarrm:main@sha256:b4ae147b7c1e60ab53778aa99e747a10c9cc0f0cbd7c54bb6864f5166a252f71
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_JELLYSWARRM_3000
      - JELLYSWARRM_USERNAME=${JELLYSWARRM_USERNAME}
      - JELLYSWARRM_PASSWORD=${JELLYSWARRM_PASSWORD}
    volumes:
      - ./jellyswarrm_data:/app/data
