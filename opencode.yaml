services:
  opencode:
    build: ./opencode
    restart: unless-stopped
    init: true
    mem_limit: 8g
    ports:
      - "4096:4096"
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TZ=${TZ:-UTC}
    volumes:
      - ./opencode/projects:/workspace
      - opencode-data:/root/.local/share/opencode
      - gh-config:/root/.config/gh
      - opencode-config:/root/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://opencode:${OPENCODE_SERVER_PASSWORD}@127.0.0.1:4096/api/info || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  opencode-data:
  gh-config:
  opencode-config:
