services:
  jellyfin:
    image: "jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
      - "JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}"
    group_add:
      - "44"
      - "993"
    volumes:
      - "jellyfin_config:/config"
      - "/mnt/media/movies:/data/movies"
      - "/mnt/media/tv:/data/tvshows"
      - "/mnt/media/music:/data/music"
      - "/mnt/ssd/transcode:/transcode"
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - "/dev/dri:/dev/dri"
    healthcheck:
      test: "curl -f http://localhost:8096/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  seerr:
    image: "ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be"
    environment:
      - "TZ=${TZ}"
    ports:
      - "5055:5055"
    volumes:
      - "/mnt/media/config/seerr:/app/config"
    healthcheck:
      test: "node -e 'fetch(\"http://localhost:5055/api/v1/status\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  radarr:
    image: "lscr.io/linuxserver/radarr:6.4.4@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "radarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/movies:/movies"
    ports:
      - "7878:7878"
    healthcheck:
      test: "curl -fs http://localhost:7878/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  sonarr:
    image: "lscr.io/linuxserver/sonarr:4.0.20@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sonarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/tv:/tv"
    ports:
      - "8989:8989"
    healthcheck:
      test: "curl -fs http://localhost:8989/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  prowlarr:
    image: "lscr.io/linuxserver/prowlarr:2.6.5@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "prowlarr_config:/config"
    ports:
      - "9696:9696"
    healthcheck:
      test: "curl -fs http://localhost:9696/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  rdtclient:
    image: "rogerfar/rdtclient:2.0.143@sha256:68523637d09ec8a120bd272756d58b393448a656b5967bd45622c4891c65ff36"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "rdtclient_data:/data/db"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "6500:6500"
    healthcheck:
      test: "curl -fs http://localhost:6500/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  sabnzbd:
    image: "lscr.io/linuxserver/sabnzbd:5.1.3@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sabnzbd_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "8081:8080"
    healthcheck:
      test: "curl -fs http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  bazarr:
    image: "lscr.io/linuxserver/bazarr:1.6.2@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "bazarr_config:/config"
      - "/mnt/media/movies:/movies"
      - "/mnt/media/tv:/tv"
    ports:
      - "6767:6767"
    healthcheck:
      test: "curl -fs http://localhost:6767/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  cleanuparr:
    image: "ghcr.io/cleanuparr/cleanuparr:2.10.12@sha256:d0212e4c66bd0522e23c5e5da5d3006bd5ff0e0de1e3ecfcf892e039d55721e2"
    environment:
      - "TZ=${TZ}"
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
    volumes:
      - "cleanuparr_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "11011:11011"
    healthcheck:
      test: "curl -fs http://localhost:11011/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  recyclarr:
    image: "ghcr.io/recyclarr/recyclarr:8@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9"
    user: "${PUID-1000}:${PGID-1000}"
    environment:
      - "TZ=${TZ}"
      - RECYCLARR_CREATE_CONFIG=true
    volumes:
      - "/mnt/media/config/recyclarr:/config"
    restart: unless-stopped
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MainNode
      - cacheDir=/temp
    group_add:
      - "44"
      - "993"
    volumes:
      - tdarr_server:/app/server
      - tdarr_configs:/app/configs
      - tdarr_logs:/app/logs
      - /mnt/media:/media
    ports:
      - 8265:8265
      - 8266:8266
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: "curl -fs http://localhost:8265/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
volumes:
  jellyfin_config: {}
  radarr_config: {}
  sonarr_config: {}
  prowlarr_config: {}
  sabnzbd_config: {}
  rdtclient_data: {}
  bazarr_config: {}
  cleanuparr_config: {}
  tdarr_server: {}
  tdarr_configs: {}
  tdarr_logs: {}
