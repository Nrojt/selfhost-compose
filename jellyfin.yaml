services:
  jellyfin:
    image: "jellyfin/jellyfin:12.1"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
      - "JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}"
    group_add:
      - "44"
      - "993"
    volumes:
      - "jellyfin_config:/config"
      - "/mnt/media/movies:/data/movies"
      - "/mnt/media/tv:/data/tvshows"
      - "/mnt/media/music:/data/music"
      - "/mnt/ssd/transcode:/transcode"
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - "/dev/dri:/dev/dri"
    healthcheck:
      test: "curl -f http://localhost:8096/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  seerr:
    image: "ghcr.io/seerr-team/seerr:v3.0.1"
    environment:
      - "TZ=${TZ}"
    ports:
      - "5055:5055"
    volumes:
      - "/mnt/media/config/seerr:/app/config"
    restart: unless-stopped
  radarr:
    image: "lscr.io/linuxserver/radarr:6.4.4"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "radarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/movies:/movies"
    ports:
      - "7878:7878"
    restart: unless-stopped
  sonarr:
    image: "lscr.io/linuxserver/sonarr:4.0.20"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sonarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/tv:/tv"
    ports:
      - "8989:8989"
    restart: unless-stopped
  prowlarr:
    image: "lscr.io/linuxserver/prowlarr:2.6.5"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "prowlarr_config:/config"
    ports:
      - "9696:9696"
    restart: unless-stopped
  rdtclient:
    image: "rogerfar/rdtclient:2.0.142"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "rdtclient_data:/data/db"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "6500:6500"
    restart: unless-stopped
  sabnzbd:
    image: "lscr.io/linuxserver/sabnzbd:5.1.3"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sabnzbd_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "8081:8080"
    restart: unless-stopped
  bazarr:
    image: "lscr.io/linuxserver/bazarr:1.6.2"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "bazarr_config:/config"
      - "/mnt/media/movies:/movies"
      - "/mnt/media/tv:/tv"
    ports:
      - "6767:6767"
    restart: unless-stopped
  cleanuparr:
    image: "ghcr.io/cleanuparr/cleanuparr:2.10.2"
    environment:
      - "TZ=${TZ}"
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
    volumes:
      - "cleanuparr_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "11011:11011"
    restart: unless-stopped
  recyclarr:
    image: "ghcr.io/recyclarr/recyclarr:8"
    user: "${PUID-1000}:${PGID-1000}"
    environment:
      - "TZ=${TZ}"
      - RECYCLARR_CREATE_CONFIG=true
    volumes:
      - "/mnt/media/config/recyclarr:/config"
    restart: unless-stopped
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.50.01
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MainNode
      - cacheDir=/temp
    group_add:
      - "44"
      - "993"
    volumes:
      - tdarr_server:/app/server
      - tdarr_configs:/app/configs
      - tdarr_logs:/app/logs
      - /mnt/media:/media
    ports:
      - 8265:8265
      - 8266:8266
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
volumes:
  jellyfin_config: null
  radarr_config: null
  sonarr_config: null
  prowlarr_config: null
  sabnzbd_config: null
  rdtclient_data: null
  bazarr_config: null
  cleanuparr_config: null
  tdarr_server: null
  tdarr_configs: null
  tdarr_logs: null
