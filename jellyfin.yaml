services:
  jellyfin:
    image: "jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
      - "JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}"
    group_add:
      - "44"
      - "993"
    volumes:
      - "jellyfin_config:/config"
      - "/mnt/media/movies:/data/movies"
      - "/mnt/media/tv:/data/tvshows"
      - "/mnt/media/music:/data/music"
      - "/mnt/ssd/transcode:/transcode"
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - "/dev/dri:/dev/dri"
    healthcheck:
      test: "curl -f http://localhost:8096/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  seerr:
    image: "ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45"
    environment:
      - "TZ=${TZ}"
    ports:
      - "5055:5055"
    volumes:
      - "/mnt/media/config/seerr:/app/config"
    restart: unless-stopped
  radarr:
    image: "lscr.io/linuxserver/radarr:6.4.4@sha256:ff4430fe2d6159b4dbaac9903acfecee5aa68dec8c929259e2f3114c63f7a09e"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "radarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/movies:/movies"
    ports:
      - "7878:7878"
    restart: unless-stopped
  sonarr:
    image: "lscr.io/linuxserver/sonarr:4.0.20@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sonarr_config:/config"
      - "/mnt/media/downloads:/downloads"
      - "/mnt/media/tv:/tv"
    ports:
      - "8989:8989"
    restart: unless-stopped
  prowlarr:
    image: "lscr.io/linuxserver/prowlarr:2.6.5@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "prowlarr_config:/config"
    ports:
      - "9696:9696"
    restart: unless-stopped
  rdtclient:
    image: "rogerfar/rdtclient:2.0.143@sha256:68523637d09ec8a120bd272756d58b393448a656b5967bd45622c4891c65ff36"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "rdtclient_data:/data/db"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "6500:6500"
    restart: unless-stopped
  sabnzbd:
    image: "lscr.io/linuxserver/sabnzbd:5.1.3@sha256:7a13af91cf296399e302d2fb6fc709d6e2ea15e3094f220684611fbe1dd43625"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "sabnzbd_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "8081:8080"
    restart: unless-stopped
  bazarr:
    image: "lscr.io/linuxserver/bazarr:1.6.2@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9"
    environment:
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
      - "TZ=${TZ}"
    volumes:
      - "bazarr_config:/config"
      - "/mnt/media/movies:/movies"
      - "/mnt/media/tv:/tv"
    ports:
      - "6767:6767"
    restart: unless-stopped
  cleanuparr:
    image: "ghcr.io/cleanuparr/cleanuparr:2.10.11@sha256:c51af6957780ad2719e97a2131fe668f61da28e43363719c7b557577fc39ebaf"
    environment:
      - "TZ=${TZ}"
      - "PUID=${PUID-1000}"
      - "PGID=${PGID-1000}"
    volumes:
      - "cleanuparr_config:/config"
      - "/mnt/media/downloads:/downloads"
    ports:
      - "11011:11011"
    restart: unless-stopped
  recyclarr:
    image: "ghcr.io/recyclarr/recyclarr:8@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209"
    user: "${PUID-1000}:${PGID-1000}"
    environment:
      - "TZ=${TZ}"
      - RECYCLARR_CREATE_CONFIG=true
    volumes:
      - "/mnt/media/config/recyclarr:/config"
    restart: unless-stopped
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.96.01@sha256:83c4c956c85ffbf3c82f479ee2fe355b52ece32e732d8b00075afb447087a3ae
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MainNode
      - cacheDir=/temp
    group_add:
      - "44"
      - "993"
    volumes:
      - tdarr_server:/app/server
      - tdarr_configs:/app/configs
      - tdarr_logs:/app/logs
      - /mnt/media:/media
    ports:
      - 8265:8265
      - 8266:8266
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
volumes:
  jellyfin_config: null
  radarr_config: null
  sonarr_config: null
  prowlarr_config: null
  sabnzbd_config: null
  rdtclient_data: null
  bazarr_config: null
  cleanuparr_config: null
  tdarr_server: null
  tdarr_configs: null
  tdarr_logs: null
