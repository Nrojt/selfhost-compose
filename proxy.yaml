services:
  jellyfin-edge:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:8096
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYFIN_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jellyseerr-edge:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:5055
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYSEERR_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
