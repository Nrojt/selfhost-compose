services:
  jellyfin-edge:
    image: caddy:2.11.9@sha256:e40b94d0a43b5ff69cb20568d73f10c70703df7b0ffc2298eb3d723cdc9d0bd1
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:8096
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYFIN_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jellyseerr-edge:
    image: caddy:2.11.9@sha256:e40b94d0a43b5ff69cb20568d73f10c70703df7b0ffc2298eb3d723cdc9d0bd1
    restart: unless-stopped
    command: caddy reverse-proxy --from http://:8080 --to ${SERVICE_IP}:5055
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_JELLYSEERR_EDGE_8080
    healthcheck:
      test: "curl -fsS http://localhost:8080/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
